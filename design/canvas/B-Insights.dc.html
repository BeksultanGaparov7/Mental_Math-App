<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F3; font-family: Inter, sans-serif; color: #16161D; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="B-Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E2E0DA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16161D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">Insights</h1>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 600">Median answer time</span>
      <span style="font-size: 13px; color: #15803D; font-weight: 600">−0.6 s in 14 days</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 6px; height: 90px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="14">
        <div style="flex-grow: 1; height: {{d.h}}; background: {{d.bg}}; border-radius: 3px 3px 0 0"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5E5E6B"><span>10 Nov</span><span>2.2 s → 1.6 s</span><span>today</span></div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 14px; font-weight: 600">Mistake patterns</span>
    <sc-for list="{{patterns}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 150px; font-size: 13px; line-height: 1.25">{{p.name}}</span>
        <span style="flex-grow: 1; height: 8px; background: #EFEDE8; border-radius: 4px; overflow: hidden"><span style="display: block; width: {{p.w}}; height: 100%; background: #C2410C"></span></span>
        <span style="width: 22px; text-align: right; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">{{p.n}}</span>
      </div>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 600">Slowest facts</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{slow}}" as="f" hint-placeholder-count="6">
        <span style="border: 1px solid #E2E0DA; border-radius: 10px; padding: 6px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 15px">{{f.q}} <span style="color: #5E5E6B; font-family: Inter, sans-serif; font-size: 12px">{{f.t}}</span></span>
      </sc-for>
    </div>
  </div>

  <a href="B-Nightmare.dc.html" style="margin-top: auto; text-decoration: none; background: #16161D; color: #FFFFFF; border-radius: 16px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px">
    <span style="color: #FFFFFF">Nightmare Trial available</span>
    <span style="color: #FFB38A">3 patterns →</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = [2.2, 2.1, 2.3, 2.0, 1.95, 2.0, 1.9, 1.85, 1.9, 1.75, 1.8, 1.7, 1.65, 1.6];
    const days = t.map((v, i) => ({ h: Math.round(v / 2.4 * 90) + 'px', bg: i === t.length - 1 ? '#2F5BEA' : '#C9D5FA' }));
    const patterns = [
      { name: 'Carry in tens column', n: 14 },
      { name: '7 × 8 fact family', n: 9 },
      { name: 'Borrow across zero', n: 7 },
      { name: 'Neighbour-table answer', n: 6 },
      { name: 'Fraction ↔ % (eighths)', n: 4 }
    ].map((p) => Object.assign(p, { w: Math.round(p.n / 14 * 100) + '%' }));
    const slow = [
      { q: '7×8', t: '3.1 s' }, { q: '23²', t: '4.4 s' }, { q: '6×9', t: '2.8 s' },
      { q: '3/8 → %', t: '5.0 s' }, { q: '91 prime?', t: '3.6 s' }, { q: '84÷7', t: '2.9 s' }
    ];
    return { days: days, patterns: patterns, slow: slow };
  }
}
</script>
</body>
</html>
