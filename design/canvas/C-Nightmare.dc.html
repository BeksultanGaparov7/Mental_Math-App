<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Nightmare Trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8CBC}a:hover{color:#FFC2DA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12061A; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 16px">

  <a href="C-Insights.dc.html" aria-label="Back to weak points" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #4A1F44; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Boss emblem: a cracked diamond with glowing eyes">
      <rect x="35" y="35" width="80" height="80" rx="12" transform="rotate(45 75 75)" fill="#1E0A2A" stroke="#FF4F9A" stroke-width="3"></rect>
      <path d="M75 22 L68 52 L80 66 L70 90" fill="none" stroke="#FF4F9A" stroke-width="2"></path>
      <path d="M55 74 l14 5" stroke="#3EE6E0" stroke-width="5" stroke-linecap="round"></path>
      <path d="M95 74 l-14 5" stroke="#3EE6E0" stroke-width="5" stroke-linecap="round"></path>
      <path d="M62 100 q13 -8 26 0" fill="none" stroke="#FF4F9A" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <span style="font-weight: 600; font-size: 13px; letter-spacing: 3px; color: #FF8CBC">BOSS UNLOCKED</span>
    <h1 style="margin: 0; font-weight: 700; font-size: 38px; letter-spacing: 3px; text-shadow: 0 0 18px rgba(255,79,154,0.7)">NIGHTMARE</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{targets}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; border: 1px solid #4A1F44; border-radius: 10px; background: #1E0A2A; padding: 10px 12px">
        <span style="width: 34px; height: 34px; border-radius: 8px; background: #FF4F9A; color: #12061A; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">{{t.n}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-weight: 700; font-size: 15px">{{t.name}}</span>
          <span style="font-size: 12px; color: #C9A9C9">{{t.example}}</span>
        </span>
        <span style="font-weight: 700; font-size: 16px; color: #FF8CBC">{{t.rate}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: center; gap: 22px; font-weight: 600; font-size: 14px; color: #C9A9C9">
    <span>20 rounds</span><span style="color: #FF8CBC">3 lives</span><span>no hints</span><span style="color: #3EE6E0">+300 XP</span>
  </div>

  <a href="C-Quiz.dc.html" style="margin-top: auto; text-decoration: none; background: #FF4F9A; color: #12061A; border-radius: 10px; height: 62px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; letter-spacing: 3px; box-shadow: 0 0 24px rgba(255,79,154,0.6)">FIGHT</a>
  <a href="C-Quiz.dc.html" style="text-align: center; font-weight: 600; font-size: 14px">Sandbox drill (untimed, method shown)</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      targets: [
        { n: 1, name: 'Carry in tens column', example: '47+38 · 68+57 · 129+46', rate: '31%' },
        { n: 2, name: '7 × 8 fact family', example: '7×8 · 56÷7 · 70×8', rate: '24%' },
        { n: 3, name: 'Borrow across zero', example: '403−128 · 700−365', rate: '19%' }
      ]
    };
  }
}
</script>
</body>
</html>
