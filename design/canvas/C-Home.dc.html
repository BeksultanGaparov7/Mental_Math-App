<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3EE6E0}a:hover{color:#9FF5F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1022; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="46" height="46" viewBox="0 0 46 46" role="img" aria-label="Rank badge: green belt">
        <rect x="3" y="3" width="40" height="40" rx="8" fill="#171A33" stroke="#3EE6E0" stroke-width="2"></rect>
        <rect x="8" y="20" width="30" height="7" rx="2" fill="#34D399"></rect>
        <path d="M23 27 l-5 10 M23 27 l5 10" stroke="#34D399" stroke-width="4" stroke-linecap="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 18px; letter-spacing: 1px">GREEN BELT</span>
        <span style="font-size: 13px; color: #A3A8D0">Rank 7 · 1,240 / 1,600 XP</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; border: 1px solid #FF4F9A; border-radius: 8px; padding: 6px 10px; color: #FF8CBC; font-weight: 700; font-size: 15px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF8CBC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-8z"></path></svg>
      12
    </div>
  </div>

  <div style="height: 6px; background: #171A33; border-radius: 3px; overflow: hidden"><div style="width: 77%; height: 100%; background: #3EE6E0; box-shadow: 0 0 10px #3EE6E0"></div></div>

  <div style="position: relative; flex-grow: 1">
    <svg width="354" height="560" viewBox="0 0 354 560" style="position: absolute; left: 0; top: 0" aria-hidden="true">
      <path d="M177 40 L90 130 L230 220 L110 310 L250 400 L177 500" fill="none" stroke="#2A2F5A" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"></path>
      <path d="M177 40 L90 130 L230 220 L110 310" fill="none" stroke="#3EE6E0" stroke-width="4" stroke-linecap="round"></path>
    </svg>
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
      <div style="position: absolute; left: {{n.left}}; top: {{n.top}}; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="width: 64px; height: 64px; border-radius: 16px; transform: rotate(45deg); background: {{n.bg}}; border: 2px solid {{n.border}}; box-shadow: {{n.glow}}; display: flex; align-items: center; justify-content: center">
          <span style="transform: rotate(-45deg); font-weight: 700; font-size: 22px; color: {{n.fg}}">{{n.sym}}</span>
        </div>
        <span style="margin-top: 8px; font-weight: 600; font-size: 13px; letter-spacing: 0.5px; color: {{n.label}}">{{n.name}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px">
    <a href="C-Quiz.dc.html" style="flex-grow: 1; text-decoration: none; background: #3EE6E0; color: #0E1022; border-radius: 10px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 18px rgba(62,230,224,0.45)">
      <span style="font-weight: 700; font-size: 19px; letter-spacing: 1px; color: #0E1022">DAILY TRAINING</span>
      <span style="font-size: 12px; font-weight: 600; color: #0E1022">24 due · 3 min</span>
    </a>
    <a href="C-Nightmare.dc.html" aria-label="Nightmare Trial" style="width: 60px; height: 60px; border-radius: 10px; border: 2px solid #FF4F9A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px rgba(255,79,154,0.4)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF8CBC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10a7 7 0 0 1 14 0v10l-3-2-2 2-2-2-2 2-2-2z"></path><circle cx="9.5" cy="10" r="1"></circle><circle cx="14.5" cy="10" r="1"></circle></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [[177, 40], [90, 130], [230, 220], [110, 310], [250, 400], [177, 500]];
    const data = [
      { sym: '+−', name: 'ADD · SUB', st: 'done' },
      { sym: '×', name: 'TABLES', st: 'done' },
      { sym: 'x²', name: 'SQUARES', st: 'done' },
      { sym: '÷', name: 'DIVISION', st: 'now' },
      { sym: '¾', name: 'FRACTIONS', st: 'lock' },
      { sym: 'V', name: 'VEDIC', st: 'lock' }
    ];
    const nodes = data.map((d, i) => ({
      sym: d.sym, name: d.name,
      left: (pts[i][0] - 60) + 'px', top: (pts[i][1] - 32) + 'px',
      bg: d.st === 'now' ? '#3EE6E0' : '#171A33',
      border: d.st === 'lock' ? '#2A2F5A' : '#3EE6E0',
      fg: d.st === 'now' ? '#0E1022' : d.st === 'lock' ? '#6B7099' : '#3EE6E0',
      label: d.st === 'lock' ? '#8A8FB8' : '#EEF0FF',
      glow: d.st === 'now' ? '0 0 22px rgba(62,230,224,0.7)' : 'none'
    }));
    return { nodes: nodes };
  }
}
</script>
</body>
</html>
