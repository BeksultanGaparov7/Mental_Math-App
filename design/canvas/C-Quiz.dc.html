<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3EE6E0}a:hover{color:#9FF5F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1022; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="C-Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A2F5A; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-weight: 700; font-size: 14px; letter-spacing: 1.5px; color: #A3A8D0">VEDIC · NIKHILAM</span>
    <span style="font-weight: 700; font-size: 18px; color: #3EE6E0">{{score}}</span>
  </div>

  <div style="display: flex; gap: 4px">
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="10">
      <div style="flex-grow: 1; height: 6px; border-radius: 2px; background: {{g.bg}}"></div>
    </sc-for>
  </div>

  <div style="margin-top: 10px; border: 1px solid #2A2F5A; border-radius: 14px; background: #171A33; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <span style="font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: 2px">{{a}} × {{b}}</span>
    <span style="font-weight: 700; font-size: 44px; color: {{ansColor}}; text-shadow: 0 0 14px {{ansGlow}}; min-height: 52px">{{shown}}</span>
    <sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}">
      <div style="width: 100%; border-top: 1px dashed #2A2F5A; padding-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #A3A8D0">
        <span>deficits from 100: <b style="color: #EEF0FF">{{da}}</b> and <b style="color: #EEF0FF">{{db}}</b></span>
        <span>left: {{a}} − {{db}} = <b style="color: #3EE6E0">{{left}}</b> · right: {{da}} × {{db}} = <b style="color: #FF8CBC">{{right}}</b></span>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <button onClick="{{toggleHint}}" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3EE6E0; background: transparent; color: #3EE6E0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; cursor: pointer">{{hintLabel}}</button>
    <span style="font-weight: 600; font-size: 15px; color: {{fbColor}}">{{feedback}}</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: auto">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.label}}" style="height: 62px; border-radius: 10px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 26px; cursor: pointer">{{k.text}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 97, b: 96, input: '', hint: true, done: 3, score: 420, status: 'idle', feedback: '' };
  }
  press(key) {
    const s = this.state;
    const ans = String(s.a * s.b);
    if (key === 'del') { this.setState({ input: s.input.slice(0, -1), status: 'idle', feedback: '' }); return; }
    if (key === 'ok') {
      if (s.input === '') return;
      if (s.input === ans) this.right();
      else this.setState({ status: 'wrong', input: '', feedback: 'It was ' + ans });
      return;
    }
    const input = (s.input + key).slice(0, 5);
    if (input === ans) { this.setState({ input: input }); setTimeout(() => this.right(), 200); }
    else this.setState({ input: input, status: 'idle', feedback: '' });
  }
  right() {
    const s = this.state;
    const a = 88 + Math.floor(Math.random() * 11);
    const b = 88 + Math.floor(Math.random() * 11);
    this.setState({ a: a, b: b, input: '', status: 'right', done: s.done >= 10 ? 1 : s.done + 1, score: s.score + (s.hint ? 20 : 40), feedback: s.hint ? '+20 (hint on)' : '+40 clean' });
  }
  renderVals() {
    const s = this.state;
    const da = 100 - s.a, db = 100 - s.b;
    const mk = (k, text, label, kind) => ({
      text: text, label: label, press: () => this.press(k),
      bg: kind === 'ok' ? '#3EE6E0' : '#171A33', fg: kind === 'ok' ? '#0E1022' : '#EEF0FF',
      border: kind === 'ok' ? '#3EE6E0' : '#2A2F5A'
    });
    const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => mk(d, d, d, 'n'));
    keys.push(mk('del', '⌫', 'Delete', 'n'), mk('0', '0', '0', 'n'), mk('ok', '✓', 'Submit', 'ok'));
    const segs = [];
    for (let i = 1; i <= 10; i++) segs.push({ bg: i < s.done ? '#3EE6E0' : i === s.done ? '#FF4F9A' : '#2A2F5A' });
    return {
      a: s.a, b: s.b, da: da, db: db, left: s.a - db, right: String(da * db).padStart(2, '0'),
      score: s.score + ' XP', segs: segs,
      shown: s.input === '' ? '____' : s.input,
      ansColor: s.status === 'wrong' ? '#FF8CBC' : '#3EE6E0',
      ansGlow: s.status === 'wrong' ? 'rgba(255,79,154,0.6)' : 'rgba(62,230,224,0.5)',
      showHint: s.hint, hintLabel: s.hint ? 'HIDE METHOD' : 'SHOW METHOD',
      toggleHint: () => this.setState({ hint: !s.hint }),
      feedback: s.feedback, fbColor: s.status === 'wrong' ? '#FF8CBC' : '#34D399',
      keys: keys
    };
  }
}
</script>
</body>
</html>
