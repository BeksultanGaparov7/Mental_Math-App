<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F3; font-family: Inter, sans-serif; color: #16161D; overflow: hidden; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px">

  <div style="display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; color: #5E5E6B">Monday, 23 Nov</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Good morning</h1>
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E2E0DA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16161D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 14px; padding: 12px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">12</div><div style="font-size: 12px; color: #5E5E6B">day streak</div></div>
    <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 14px; padding: 12px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Lv 7</div><div style="font-size: 12px; color: #5E5E6B">360 XP to 8</div></div>
    <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 14px; padding: 12px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">1.4s</div><div style="font-size: 12px; color: #5E5E6B">median fact</div></div>
  </div>

  <a href="B-Quiz.dc.html" style="text-decoration: none; background: #2F5BEA; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF">
    <span style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.6px; color: #DCE4FF">TODAY</span>
      <span style="font-size: 13px; font-weight: 600; color: #DCE4FF">≈ 3 min</span>
    </span>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: #FFFFFF">Daily Mix · 24 due</span>
    <span style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="background: #4A70EE; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #FFFFFF">× tables</span>
      <span style="background: #4A70EE; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #FFFFFF">carries</span>
      <span style="background: #4A70EE; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #FFFFFF">fractions</span>
      <span style="background: #4A70EE; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #FFFFFF">squares</span>
    </span>
    <span style="align-self: flex-start; background: #FFFFFF; color: #1E3FB0; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 15px">Start</span>
  </a>

  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Skills</h2>
    <a href="B-Insights.dc.html" style="font-size: 14px; font-weight: 600">Insights</a>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 16px; display: flex; flex-direction: column">
    <sc-for list="{{skills}}" as="s" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid #EFEDE8">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF2FE; color: #1E3FB0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center">{{s.sym}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>{{s.name}}</span><span style="color: #5E5E6B; font-weight: 500; font-size: 13px">{{s.lvl}}</span></span>
          <span style="height: 6px; background: #EFEDE8; border-radius: 3px; overflow: hidden"><span style="display: block; width: {{s.pct}}; height: 100%; background: #2F5BEA"></span></span>
        </span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      skills: [
        { sym: '+', name: 'Addition', lvl: 'Level 4 of 5', pct: '82%' },
        { sym: '×', name: 'Multiplication', lvl: 'Level 2 of 5', pct: '46%' },
        { sym: 'x²', name: 'Squares & roots', lvl: 'Level 3 of 5', pct: '58%' },
        { sym: '¾', name: 'Fractions & %', lvl: 'Level 1 of 5', pct: '20%' },
        { sym: 'p', name: 'Primes & factors', lvl: 'Level 2 of 5', pct: '35%' },
        { sym: 'V', name: 'Vedic tricks', lvl: '2 of 7 lessons', pct: '28%' }
      ]
    };
  }
}
</script>
</body>
</html>
