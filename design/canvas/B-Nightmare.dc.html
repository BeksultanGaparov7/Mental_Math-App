<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Nightmare Trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#DCE4FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16161D; font-family: Inter, sans-serif; color: #F7F6F3; overflow: hidden; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 18px">

  <a href="B-Insights.dc.html" aria-label="Back to insights" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #34343F; display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F6F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 1px; color: #FFB38A">NIGHTMARE TRIAL</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1">Your three weakest patterns, on purpose.</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #B9B9C6">20 questions. 70 % target your patterns, 30 % are decoys. Three misses ends the run.</p>
  </div>

  <div style="display: flex; flex-direction: column; border-top: 1px solid #34343F">
    <sc-for list="{{targets}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #34343F">
        <span style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 16px; font-weight: 600">{{t.name}}</span>
          <span style="font-size: 13px; color: #B9B9C6">{{t.example}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #FFB38A">{{t.rate}}</span>
          <span style="font-size: 11px; color: #B9B9C6">miss rate</span>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px">
    <div style="flex-grow: 1; border: 1px solid #34343F; border-radius: 14px; padding: 12px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">~4 min</div><div style="font-size: 12px; color: #B9B9C6">duration</div></div>
    <div style="flex-grow: 1; border: 1px solid #34343F; border-radius: 14px; padding: 12px"><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">+300 XP</div><div style="font-size: 12px; color: #B9B9C6">on clear</div></div>
  </div>

  <a href="B-Quiz.dc.html" style="margin-top: auto; text-decoration: none; background: #F7F6F3; color: #16161D; border-radius: 999px; height: 58px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px">Begin trial</a>
  <a href="B-Quiz.dc.html" style="text-align: center; font-size: 14px; font-weight: 500; color: #B9B9C6">Sandbox: practise untimed with hints</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      targets: [
        { name: 'Carry in the tens column', example: '47 + 38 · 68 + 57 · 129 + 46', rate: '31%' },
        { name: '7 × 8 fact family', example: '7×8 · 56÷7 · 70×8 · 7×18', rate: '24%' },
        { name: 'Borrow across a zero', example: '403 − 128 · 700 − 365', rate: '19%' }
      ]
    };
  }
}
</script>
</body>
</html>
