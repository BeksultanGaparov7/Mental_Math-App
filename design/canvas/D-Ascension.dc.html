<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Ascension</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3EE6E0}a:hover{color:#9FF5F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A1030; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 28px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px">

  <span style="font-weight: 600; font-size: 13px; letter-spacing: 4px; color: #9FC3FF">ASCENSION COMPLETE</span>

  <svg width="220" height="210" viewBox="0 0 220 210" role="img" aria-label="Your shadow companion in its new Warden form, wearing a blue belt, surrounded by a ring of light">
    <circle cx="110" cy="100" r="92" fill="none" stroke="#4C8DFF" stroke-width="2" opacity="0.5"></circle>
    <circle cx="110" cy="100" r="76" fill="none" stroke="#3EE6E0" stroke-width="1.5" stroke-dasharray="3 9"></circle>
    <ellipse cx="110" cy="196" rx="54" ry="6" fill="#4C8DFF" opacity="0.3"></ellipse>
    <path d="M62 192 L70 92 Q110 30 150 92 L158 192 Q134 178 110 192 Q86 178 62 192 Z" fill="#1A2560" stroke="#7FB0FF" stroke-width="2"></path>
    <path d="M70 92 L52 70 M150 92 L168 70" stroke="#7FB0FF" stroke-width="3" stroke-linecap="round"></path>
    <path d="M84 100 Q110 74 136 100 L132 128 Q110 138 88 128 Z" fill="#05060F"></path>
    <path d="M93 110 l11 4" stroke="#3EE6E0" stroke-width="4.5" stroke-linecap="round"></path>
    <path d="M127 110 l-11 4" stroke="#3EE6E0" stroke-width="4.5" stroke-linecap="round"></path>
    <rect x="74" y="148" width="72" height="10" rx="3" fill="#4C8DFF"></rect>
    <path d="M110 158 l-8 18 M110 158 l8 18" stroke="#4C8DFF" stroke-width="5" stroke-linecap="round"></path>
  </svg>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
    <span style="font-size: 14px; color: #9FC3FF">Hunter → </span>
    <h1 style="margin: 0; font-weight: 700; font-size: 44px; letter-spacing: 5px; text-shadow: 0 0 20px rgba(76,141,255,0.8)">WARDEN</h1>
    <span style="font-size: 13px; color: #9FC3FF">Rank 4 of 7 · blue belt</span>
  </div>

  <div style="width: 100%; box-sizing: border-box; background: #121A45; border: 1px solid #2A3A80; border-radius: 10px; box-shadow: 0 6px 0 #04071A; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px">
    <span style="font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #9FC3FF">YOU PROVED</span>
    <sc-for list="{{proved}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3EE6E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-11"></path></svg>
        <span>{{p.t}}</span>
      </div>
    </sc-for>
  </div>

  <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{gifts}}" as="g" hint-placeholder-count="3">
      <div style="background: #121A45; border: 1px solid #2A3A80; border-radius: 10px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center">
        <span style="font-weight: 700; font-size: 16px; color: {{g.c}}">{{g.big}}</span>
        <span style="font-size: 11px; color: #9FC3FF; line-height: 1.25">{{g.small}}</span>
      </div>
    </sc-for>
  </div>

  <a href="D-Home.dc.html" style="margin-top: auto; width: 100%; text-decoration: none; background: #4C8DFF; color: #04071A; border-radius: 10px; box-shadow: 0 7px 0 #22479A, 0 0 22px rgba(76,141,255,0.5); height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; letter-spacing: 3px">CONTINUE</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      proved: [
        { t: '3 drills at Level III or higher' },
        { t: 'Ascension exam · 27 / 30 across 5 drills' },
        { t: 'Night Watch kept 7 nights in a row' }
      ],
      gifts: [
        { big: 'New form', small: 'companion: Warden', c: '#7FB0FF' },
        { big: '+500', small: 'Essence', c: '#C9B8FF' },
        { big: 'Relic', small: 'Tide-glass numpad', c: '#3EE6E0' }
      ]
    };
  }
}
</script>
</body>
</html>
