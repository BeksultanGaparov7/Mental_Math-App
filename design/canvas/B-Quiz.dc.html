<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6F3; font-family: Inter, sans-serif; color: #16161D; overflow: hidden; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; gap: 14px">
    <a href="B-Home.dc.html" aria-label="Close quiz" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E2E0DA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16161D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 6px; background: #E2E0DA; border-radius: 3px; overflow: hidden"><div style="width: {{progressPct}}; height: 100%; background: #2F5BEA"></div></div>
    <span style="font-size: 14px; font-weight: 600; color: #5E5E6B">{{count}}/24</span>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5E5E6B">
    <span>Daily Mix · {{skill}}</span>
    <span>streak in set: {{combo}}</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 64px; font-weight: 500; letter-spacing: -1px">{{q}}</span>
    <span style="min-width: 160px; padding-bottom: 6px; border-bottom: 3px solid {{lineColor}}; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 46px; font-weight: 700; color: {{ansColor}}">{{shown}}</span>
    <span style="height: 22px; font-size: 15px; font-weight: 500; color: {{fbColor}}">{{feedback}}</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.label}}" style="height: 64px; border-radius: 16px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 500; cursor: pointer">{{k.text}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '47 + 38', ans: '85', skill: 'Addition L4', input: '', combo: 3, count: 9, feedback: '', status: 'idle' };
  }
  gen() {
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const k = r(0, 3);
    if (k === 0) { const a = r(25, 89), b = r(15, 69); return { q: a + ' + ' + b, ans: String(a + b), skill: 'Addition L4' }; }
    if (k === 1) { const a = r(6, 9), b = r(3, 9); return { q: a + ' × ' + b, ans: String(a * b), skill: 'Multiply L2' }; }
    if (k === 2) { const a = r(13, 25); return { q: a + '²', ans: String(a * a), skill: 'Squares L2' }; }
    const a = r(42, 99), b = r(13, a - 10); return { q: a + ' − ' + b, ans: String(a - b), skill: 'Subtract L4' };
  }
  press(key) {
    const s = this.state;
    if (key === 'del') { this.setState({ input: s.input.slice(0, -1), status: 'idle', feedback: '' }); return; }
    if (key === 'ok') {
      if (s.input === '') return;
      if (s.input === s.ans) this.right();
      else this.setState({ status: 'wrong', combo: 0, input: '', feedback: 'Answer: ' + s.ans + ' — added to review' });
      return;
    }
    const input = (s.input + key).slice(0, 4);
    if (input === s.ans) { this.setState({ input: input }); setTimeout(() => this.right(), 180); }
    else this.setState({ input: input, status: 'idle', feedback: '' });
  }
  right() {
    const s = this.state;
    this.setState(Object.assign(this.gen(), { input: '', status: 'right', combo: s.combo + 1, count: s.count >= 24 ? 1 : s.count + 1, feedback: 'Correct · 1.2 s' }));
  }
  renderVals() {
    const s = this.state;
    const mk = (k, text, label, kind) => ({
      text: text, label: label, press: () => this.press(k),
      bg: kind === 'ok' ? '#2F5BEA' : '#FFFFFF', fg: kind === 'ok' ? '#FFFFFF' : '#16161D',
      border: kind === 'ok' ? '#2F5BEA' : '#E2E0DA'
    });
    const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => mk(d, d, d, 'n'));
    keys.push(mk('del', '⌫', 'Delete', 'n'), mk('0', '0', '0', 'n'), mk('ok', '✓', 'Submit', 'ok'));
    return {
      q: s.q, skill: s.skill, combo: s.combo, count: s.count,
      progressPct: Math.round(s.count / 24 * 100) + '%',
      shown: s.input === '' ? ' ' : s.input,
      lineColor: s.status === 'wrong' ? '#C2410C' : s.status === 'right' ? '#15803D' : '#2F5BEA',
      ansColor: '#16161D',
      feedback: s.feedback,
      fbColor: s.status === 'wrong' ? '#C2410C' : '#15803D',
      keys: keys
    };
  }
}
</script>
</body>
</html>
