<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Bestiary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8CBC}a:hover{color:#FFC2DA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D1E; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="D-Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A2F5A; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-weight: 700; font-size: 24px; letter-spacing: 2px">BESTIARY</h1>
      <span style="font-size: 12px; color: #A3A8D0">Your mistakes, given a shape · 5 active · 2 banished</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <sc-for list="{{beasts}}" as="b" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; background: #151936; border: 1px solid #2A2F5A; border-radius: 10px; box-shadow: 0 5px 0 #05060F; padding: 9px 11px">
        <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
          <path d="M6 40 Q4 14 22 6 Q40 14 38 40 L32 34 L27 40 L22 34 L17 40 L12 34 Z" fill="#1E0A2A" stroke="{{b.color}}" stroke-width="2"></path>
          <path d="M14 20 l6 3" stroke="{{b.color}}" stroke-width="3" stroke-linecap="round"></path>
          <path d="M30 20 l-6 3" stroke="{{b.color}}" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
            <span style="font-weight: 700; font-size: 15px">{{b.name}}</span>
            <span style="border-radius: 4px; padding: 1px 6px; font-weight: 700; font-size: 11px; letter-spacing: 1px; background: {{b.color}}; color: {{b.chipText}}">{{b.rank}}</span>
          </span>
          <span style="font-size: 12px; color: #A3A8D0">{{b.pattern}}</span>
          <span style="font-size: 12px; color: #FF8CBC">{{b.stats}}</span>
        </span>
        <a href="D-Quiz.dc.html" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #FF4F9A; display: flex; align-items: center; font-weight: 700; font-size: 13px; letter-spacing: 1px">HUNT</a>
      </div>
    </sc-for>
  </div>

  <div style="background: #151936; border: 1px solid #2A2F5A; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #A3A8D0">LAIR MAP · × TABLE</span>
      <span style="font-size: 11px; color: #A3A8D0">brighter = more misses</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{heat}}" as="c" hint-placeholder-count="81">
        <div style="height: 21px; border-radius: 3px; background: {{c.bg}}; color: {{c.fg}}; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center">{{c.t}}</div>
      </sc-for>
    </div>
  </div>

  <a href="D-Nightmare.dc.html" style="margin-top: auto; text-decoration: none; border: 2px solid #FF4F9A; border-radius: 10px; box-shadow: 0 0 16px rgba(255,79,154,0.35); height: 54px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; letter-spacing: 2px">NIGHTMARE TRIAL READY</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = {
      Whisper: { color: '#7A4A6E', chipText: '#FFFFFF' },
      Beast: { color: '#C43E84', chipText: '#FFFFFF' },
      Horror: { color: '#FF4F9A', chipText: '#12061A' },
      Terror: { color: '#FFB3D1', chipText: '#12061A' }
    };
    const beasts = [
      { name: 'The Carry-Eater', rank: 'Horror', pattern: 'forgets the carry in the tens column', stats: '14 misses · 31% miss rate · growing' },
      { name: 'Seven-Eight Shade', rank: 'Beast', pattern: '7×8 family: 56, 56÷7, 70×8', stats: '9 misses · 24% · shrinking' },
      { name: 'Zero-Borrow Wraith', rank: 'Beast', pattern: 'borrowing across a zero (403 − 128)', stats: '7 misses · 19%' },
      { name: 'Revenant · Ten-Shifter', rank: 'Whisper', pattern: 'returned: answer off by ×10', stats: 'banished 9 Nov · came back 2×' }
    ].map((b) => Object.assign(b, R[b.rank]));
    const hot = { '7x8': 4, '8x7': 4, '6x8': 3, '8x6': 3, '7x6': 2, '6x7': 2, '9x7': 3, '7x9': 3, '8x9': 2, '9x8': 2, '6x9': 1, '7x7': 1, '8x8': 1, '4x7': 1 };
    const shades = ['#1E2247', '#4A2448', '#8A2F68', '#D9418A', '#FF8CBC'];
    const heat = [{ t: '×', bg: 'transparent', fg: '#A3A8D0' }];
    for (let c = 2; c <= 9; c++) heat.push({ t: c, bg: 'transparent', fg: '#A3A8D0' });
    for (let r = 2; r <= 9; r++) {
      heat.push({ t: r, bg: 'transparent', fg: '#A3A8D0' });
      for (let c = 2; c <= 9; c++) {
        const v = hot[r + 'x' + c] || 0;
        heat.push({ t: r * c, bg: shades[v], fg: v >= 3 ? '#12061A' : '#EEF0FF' });
      }
    }
    return { beasts: beasts, heat: heat };
  }
}
</script>
</body>
</html>
