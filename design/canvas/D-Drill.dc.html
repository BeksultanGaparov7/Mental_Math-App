<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Drill path</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3EE6E0}a:hover{color:#9FF5F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D1E; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="D-Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2A2F5A; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-weight: 700; font-size: 24px; letter-spacing: 2px">MULTIPLICATION</h1>
      <span style="font-size: 12px; color: #A3A8D0">Placed at Level II by your Awakening · 9 Nov</span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; align-items: {{l.align}}">
        <div style="width: 270px; box-sizing: border-box; background: {{l.bg}}; border: {{l.border}}; border-radius: 10px; box-shadow: {{l.shadow}}; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
          <span style="width: 42px; height: 42px; border-radius: 9px; transform: rotate(45deg); border: 2px solid {{l.ring}}; background: {{l.tile}}; display: flex; align-items: center; justify-content: center">
            <span style="transform: rotate(-45deg); font-weight: 700; font-size: 16px; color: {{l.numColor}}">{{l.roman}}</span>
          </span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-weight: 700; font-size: 15px; color: {{l.titleColor}}">{{l.title}}</span>
            <span style="font-size: 12px; color: {{l.subColor}}">{{l.sub}}</span>
          </span>
        </div>
        <sc-if value="{{l.hasGate}}" hint-placeholder-val="{{ true }}">
          <div style="align-self: center; margin: 6px 0 0; display: flex; align-items: center; gap: 8px; border: 1px dashed {{l.gateColor}}; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: {{l.gateColor}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V9a7 7 0 0 1 14 0v12M5 21h14M12 21v-6"></path></svg>
            {{l.gate}}
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div role="group" aria-label="Training mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #151936; border: 1px solid #2A2F5A; border-radius: 10px; padding: 4px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button onClick="{{m.pick}}" style="height: 40px; border: 0; border-radius: 7px; background: {{m.bg}}; color: {{m.fg}}; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px">
    <a href="D-Quiz.dc.html" style="flex-grow: 1; text-decoration: none; background: #FFC857; color: #0B0D1E; border-radius: 10px; box-shadow: 0 6px 0 #8A6512; height: 56px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; letter-spacing: 1.5px">TRAIN · LV III</a>
    <a href="D-Gate.dc.html" style="flex-grow: 1; text-decoration: none; background: #3EE6E0; color: #0B0D1E; border-radius: 10px; box-shadow: 0 6px 0 #1C7F7B; height: 56px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; letter-spacing: 1.5px">OPEN GATE</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'Set of 20' }; }
  renderVals() {
    const L = (o) => {
      const done = o.st === 'done', now = o.st === 'now', lock = o.st === 'lock';
      return Object.assign(o, {
        bg: now ? '#123B45' : '#151936',
        border: now ? '2px solid #3EE6E0' : '1px solid #2A2F5A',
        shadow: now ? '0 0 18px rgba(62,230,224,0.35), 0 6px 0 #05060F' : '0 6px 0 #05060F',
        ring: lock ? '#3A3F6A' : '#3EE6E0',
        tile: done ? '#3EE6E0' : '#0B0D1E',
        numColor: done ? '#0B0D1E' : lock ? '#8A8FB8' : '#3EE6E0',
        titleColor: lock ? '#A3A8D0' : '#EEF0FF',
        subColor: now ? '#9FF5F2' : '#A3A8D0',
        hasGate: !!o.gate
      });
    };
    const levels = [
      L({ roman: 'I', title: 'Tables 2–5', sub: 'Mastered · ★★★', st: 'done', align: 'flex-start' }),
      L({ roman: 'II', title: 'Tables 6–9', sub: 'Mastered · ★★☆', st: 'done', align: 'flex-end' }),
      L({ roman: 'III', title: 'Tables 11–12', sub: 'Mastery 20 / 20 · median 2.1 s', st: 'now', align: 'flex-start', gate: 'GATE READY', gateColor: '#3EE6E0' }),
      L({ roman: 'IV', title: '2-digit × 1-digit', sub: 'Sealed', st: 'lock', align: 'flex-end', gate: 'LEAP GATE · skip ahead', gateColor: '#7FA8C9' }),
      L({ roman: 'V', title: 'Teens × teens', sub: 'Sealed · Leap Gate open (+2)', st: 'lock', align: 'flex-start' })
    ];
    const modes = ['Sprint 60s', 'Set of 20', 'Untimed'].map((m) => ({
      label: m, pick: () => this.setState({ mode: m }),
      bg: this.state.mode === m ? '#FFC857' : 'transparent',
      fg: this.state.mode === m ? '#0B0D1E' : '#EEF0FF'
    }));
    return { levels: levels, modes: modes };
  }
}
</script>
</body>
</html>
