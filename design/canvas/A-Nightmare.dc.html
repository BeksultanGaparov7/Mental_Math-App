<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Nightmare Trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E9E4FB}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #140F24; font-family: Nunito, sans-serif; color: #FFFFFF; overflow: hidden; padding: 16px 18px 22px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="A-Insights.dc.html" aria-label="Back to insights" style="width: 44px; height: 44px; border-radius: 12px; background: #2A2240; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-weight: 900; font-size: 14px; color: #CFC6F2">BOSS LEVEL</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <svg width="160" height="140" viewBox="0 0 160 140" role="img" aria-label="Tally in a dark hood holding a torch">
      <path d="M30 128 L42 30 Q80 0 118 30 L130 128 Z" fill="#2A1B6B"></path>
      <rect x="50" y="44" width="60" height="58" rx="16" fill="#E8704F"></rect>
      <path d="M58 64 l14 6" stroke="#1C1B22" stroke-width="5" stroke-linecap="round"></path>
      <path d="M102 64 l-14 6" stroke="#1C1B22" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="66" cy="74" r="5" fill="#1C1B22"></circle>
      <circle cx="94" cy="74" r="5" fill="#1C1B22"></circle>
      <path d="M68 92 h24" stroke="#5A1D0C" stroke-width="4" stroke-linecap="round"></path>
      <rect x="134" y="60" width="6" height="56" rx="3" fill="#A79BD9"></rect>
      <path d="M137 34 q12 14 0 26 q-12 -12 0 -26 z" fill="#FFD27A"></path>
    </svg>
    <h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 38px; letter-spacing: 1px; color: #FF9B85">NIGHTMARE TRIAL</h1>
    <span style="font-weight: 800; font-size: 14px; color: #CFC6F2; text-align: center">Built from the mistakes you keep making.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{targets}}" as="t" hint-placeholder-count="3">
      <div style="background: #2A2240; border-radius: 8px; box-shadow: 0 5px 0 #0B0716; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 900; font-size: 15px">{{t.name}}</span>
          <span style="font-weight: 700; font-size: 12px; color: #CFC6F2">{{t.example}}</span>
        </span>
        <span style="font-family: 'Lilita One', sans-serif; font-size: 18px; color: #FF9B85">{{t.rate}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #2A2240; border-radius: 8px; padding: 10px; text-align: center"><div style="font-family: 'Lilita One', sans-serif; font-size: 22px">20</div><div style="font-weight: 800; font-size: 12px; color: #CFC6F2">questions</div></div>
    <div style="background: #2A2240; border-radius: 8px; padding: 10px; text-align: center"><div style="font-family: 'Lilita One', sans-serif; font-size: 22px; color: #FF9B85">3 lives</div><div style="font-weight: 800; font-size: 12px; color: #CFC6F2">no hints</div></div>
    <div style="background: #2A2240; border-radius: 8px; padding: 10px; text-align: center"><div style="font-family: 'Lilita One', sans-serif; font-size: 22px; color: #FFD27A">+300</div><div style="font-weight: 800; font-size: 12px; color: #CFC6F2">XP + badge</div></div>
  </div>

  <a href="A-Quiz.dc.html" style="margin-top: auto; text-decoration: none; background: #C9492A; color: #FFFFFF; border-radius: 8px; box-shadow: 0 7px 0 #6E2010; height: 64px; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 26px; letter-spacing: 1px">ENTER THE TRIAL</a>
  <a href="A-Quiz.dc.html" style="text-align: center; font-weight: 800; font-size: 14px; color: #CFC6F2">Practice untimed in the sandbox</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      targets: [
        { name: 'Carry in the tens column', example: 'e.g. 47 + 38, 68 + 57', rate: '31% miss' },
        { name: '7 × 8 fact family', example: '7×8, 8×7, 56÷7, 70×8', rate: '24% miss' },
        { name: 'Borrow across a zero', example: 'e.g. 403 − 128', rate: '19% miss' }
      ]
    };
  }
}
</script>
</body>
</html>
