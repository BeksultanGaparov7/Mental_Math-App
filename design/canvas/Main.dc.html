<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A1B6B}a:hover{color:#160C45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1C1B22; font-family: Nunito, sans-serif; color: #2A1B6B; overflow: hidden; padding: 16px 18px 0; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 8px; background: #2B2933; color: #FFD27A; border-radius: 14px; padding: 8px 12px; font-weight: 900; font-size: 15px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD27A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-8z"></path></svg>
      12-day streak
    </div>
    <button aria-label="Settings" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: #E8704F; box-shadow: 0 5px 0 #8F2F18; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div style="display: flex; justify-content: center; margin-top: -6px">
    <svg width="150" height="132" viewBox="0 0 150 132" role="img" aria-label="Mascot Tally, a chunky number tile with a headband">
      <rect x="44" y="104" width="12" height="16" fill="#F2D9B8"></rect>
      <rect x="94" y="104" width="12" height="16" fill="#F2D9B8"></rect>
      <rect x="36" y="116" width="26" height="12" rx="6" fill="#7C6CF0"></rect>
      <rect x="88" y="116" width="26" height="12" rx="6" fill="#7C6CF0"></rect>
      <rect x="25" y="14" width="100" height="94" rx="22" fill="#B9502F"></rect>
      <rect x="25" y="8" width="100" height="90" rx="22" fill="#E8704F"></rect>
      <rect x="25" y="26" width="100" height="14" fill="#E9E4FB"></rect>
      <text x="75" y="37.5" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="12" fill="#2A1B6B">+ − × ÷</text>
      <circle cx="58" cy="60" r="11" fill="#FFFFFF"></circle>
      <circle cx="92" cy="60" r="11" fill="#FFFFFF"></circle>
      <circle cx="61" cy="62" r="5" fill="#1C1B22"></circle>
      <circle cx="95" cy="62" r="5" fill="#1C1B22"></circle>
      <path d="M62 80 q13 10 26 0" fill="none" stroke="#5A1D0C" stroke-width="4" stroke-linecap="round"></path>
      <path d="M125 50 q14 -6 12 -22" fill="none" stroke="#E8704F" stroke-width="7" stroke-linecap="round"></path>
    </svg>
  </div>

  <div style="background: #E9E4FB; border-radius: 6px; box-shadow: 0 6px 0 #A79BD9; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Lilita One', sans-serif; font-size: 28px">LEVEL 7</span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 16px; letter-spacing: 0.5px">QUICK THINKER</span>
    </div>
    <div style="height: 12px; background: #CFC6F2; border-radius: 6px; overflow: hidden"><div style="width: 77%; height: 100%; background: #E8704F"></div></div>
    <span style="font-weight: 900; font-size: 13px">1,240 / 1,600 XP</span>
  </div>

  <a href="A-Quiz.dc.html" style="text-decoration: none; background: #E8704F; color: #FFFFFF; border-radius: 6px; box-shadow: 0 6px 0 #8F2F18; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; flex-direction: column">
      <span style="font-family: 'Lilita One', sans-serif; font-size: 24px; letter-spacing: 0.5px; color: #FFFFFF">DAILY MIX</span>
      <span style="font-weight: 800; font-size: 13px; color: #FFFFFF">3 min · 24 cards due</span>
    </span>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
  </a>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; margin-top: 4px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
      <div style="border-radius: 6px; overflow: hidden; box-shadow: 0 6px 0 #8F2F18; display: flex; flex-direction: column">
        <div style="height: 92px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 34px; color: #2A1B6B">{{t.glyph}}</div>
        <div style="background: #C9492A; color: #FFFFFF; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center">
          <span style="font-family: 'Lilita One', sans-serif; font-size: 15px; letter-spacing: 0.4px">{{t.name}}</span>
          <span style="font-weight: 900; font-size: 12px; background: #8F2F18; border-radius: 8px; padding: 2px 7px">{{t.lvl}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tiles: [
        { name: 'ADDITION', glyph: '7 + 8', lvl: 'L4', bg: '#E9E4FB' },
        { name: 'MULTIPLY', glyph: '6 × 7', lvl: 'L2', bg: '#D6F3E4' },
        { name: 'SQUARES', glyph: '35²', lvl: 'L3', bg: '#D6F3E4' },
        { name: 'FRACTIONS', glyph: '3/8', lvl: 'L1', bg: '#E9E4FB' },
        { name: 'VEDIC', glyph: '97×96', lvl: 'NEW', bg: '#E9E4FB' },
        { name: 'PRIMES', glyph: '91?', lvl: 'L2', bg: '#D6F3E4' }
      ]
    };
  }
}
</script>
</body>
</html>
