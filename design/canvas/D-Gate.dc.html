<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Gate Challenge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3EE6E0}a:hover{color:#9FF5F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #071A24; font-family: 'Chakra Petch', sans-serif; color: #EEF0FF; overflow: hidden; padding: 16px 16px 22px; display: flex; flex-direction: column; gap: 14px">

  <a href="D-Drill.dc.html" aria-label="Back to drill" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #1F4A57; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <svg width="170" height="150" viewBox="0 0 170 150" role="img" aria-label="A tall glowing gate engraved with multiplication signs">
      <ellipse cx="85" cy="142" rx="70" ry="6" fill="#3EE6E0" opacity="0.2"></ellipse>
      <path d="M25 142 V58 A60 60 0 0 1 145 58 V142" fill="#0E2A36" stroke="#3EE6E0" stroke-width="3"></path>
      <path d="M42 142 V62 A43 43 0 0 1 128 62 V142" fill="#05141B" stroke="#1F6F78" stroke-width="2"></path>
      <path d="M85 20 V142" stroke="#1F6F78" stroke-width="2"></path>
      <text x="63" y="92" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-size="22" font-weight="700" fill="#3EE6E0">×</text>
      <text x="107" y="92" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-size="22" font-weight="700" fill="#3EE6E0">×</text>
      <text x="85" y="48" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-size="16" font-weight="700" fill="#9FF5F2">III</text>
    </svg>
    <span style="font-weight: 600; font-size: 12px; letter-spacing: 3px; color: #9FF5F2">GATE CHALLENGE</span>
    <h1 style="margin: 0; font-weight: 700; font-size: 28px; letter-spacing: 2px; text-align: center">MULTIPLICATION III → IV</h1>
    <span style="font-size: 13px; color: #A3BEC9">Why now: mastery bar full (20 / 20)</span>
  </div>

  <div style="background: #0E2A36; border: 1px solid #1F4A57; border-radius: 10px; box-shadow: 0 6px 0 #03090C; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #9FF5F2">TO PASS</span>
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #C7D6DC">{{r.k}}</span><span style="font-weight: 700">{{r.v}}</span></div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="border: 1px solid #1F4A57; border-radius: 10px; padding: 10px 12px"><div style="font-size: 12px; color: #A3BEC9">PASS</div><div style="font-weight: 700; font-size: 15px; color: #3EE6E0">Level IV opens · +150 XP</div></div>
    <div style="border: 1px solid #1F4A57; border-radius: 10px; padding: 10px 12px"><div style="font-size: 12px; color: #A3BEC9">FAIL</div><div style="font-weight: 700; font-size: 15px">Gate rests 1 hour</div></div>
  </div>

  <div style="border: 1px dashed #7FA8C9; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px">
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-weight: 700; font-size: 14px; color: #CFE0EA">Leap Gate · straight to Level V</span>
      <span style="font-size: 12px; color: #A3BEC9">Teens × teens exam · fail = rests 24 h</span>
    </span>
    <a href="D-Quiz.dc.html" style="font-weight: 700; font-size: 14px; letter-spacing: 1px; white-space: nowrap">LEAP</a>
  </div>

  <a href="D-Quiz.dc.html" style="margin-top: auto; text-decoration: none; background: #3EE6E0; color: #071A24; border-radius: 10px; box-shadow: 0 7px 0 #1C7F7B, 0 0 24px rgba(62,230,224,0.4); height: 62px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 21px; letter-spacing: 3px">OPEN THE GATE</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rules: [
        { k: 'Questions', v: '20 · tables 11–12 + review' },
        { k: 'Accuracy', v: '≥ 18 / 20' },
        { k: 'Median time', v: '≤ 3.0 s' }
      ]
    };
  }
}
</script>
</body>
</html>
